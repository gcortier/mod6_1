services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:${API_PORT}"
    volumes:
      - ./backend/models:/app/models
      - ./backend/logs:/app/logs  # Montage du volume pour stocker les logs
      # Montage du volume pour mlflow
      - ./mlflow/mlruns:/mlflow/mlruns
      - ./mlflow/artifacts:/mlflow/artifacts
      - ./backend/data/:/app/data # Montage du volume pour stocker les corrections
    # env_file:
    #   - .env
    environment:
      - API_PORT=${API_PORT:-8000}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8501:${STREAMLIT_PORT}"
    env_file:
      - .env
    # volumes:
    #   - ./logs_mnistretrain:/logs  # Montage du volume pour stocker les logs
    volumes:
      - ./frontend/logs:/app/logs  # Montage du volume pour stocker les logs
    environment:
      - API_URL=${API_URL:-http://backend:8000}
      # - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    depends_on:
      - backend
    networks:
      - app_network 

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    environment:
      - API_PORT=${API_PORT}
    volumes:
      - ./prometheus_mnistretrain/prometheus.yml:/etc/prometheus_mnistretrain/prometheus.yml
    command:
      - "--config.file=/etc/prometheus_mnistretrain/prometheus.yml"
    depends_on:
      - backend
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - API_PORT=${API_PORT}
      - PROMETHEUS_PORT=${PROMETHEUS_PORT}
    volumes:
      - ./grafana_mnistretrain/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana_mnistretrain/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - app_network

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime_kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped
    networks:
      - app_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"
    networks:
      - app_network

  mlflow:
    build: ./mlflow
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow/mlruns:/mlflow/mlruns
      - ./mlflow/artifacts:/mlflow/artifacts
    networks:
      - app_network
    restart: unless-stopped


  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    container_name: prefect-server
    ports:
      - "4200:4200"        # UI + API
    volumes:
      - prefect_data:/root/.prefect  # persistance SQLite
    restart: unless-stopped
    networks:
      - app_network

  prefect-backend:
    build: ./prefect_backend
    container_name: prefect-backend
    depends_on:
      - prefect-server
    environment:
      - PREFECT_API_URL=${PREFECT_API_URL:-http://prefect-server:4200/api}
      - PYTHONIOENCODING=utf-8
    restart: unless-stopped


volumes:
  uptime-kuma-data:
  prefect_data:


networks:
  app_network:
    driver: bridge
